[package]
name = "cargo-rscode"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

description = "Cargo subcommand (and MCP server) for viewing, searching, and editing Rust source files by item path"
categories = ["development-tools", "development-tools::cargo-plugins", "command-line-utilities"]
keywords = ["cargo", "refactoring", "mcp", "rustfmt"]

[dependencies]
anyhow.workspace = true
cargo.workspace = true
clap.workspace = true
clap_complete.workspace = true
rscode = { workspace = true, features = ["cargo", "clap"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true }

[features]
default = ["mcp"]
## `cargo rscode mcp`: serve rscode's operations over the Model Context Protocol (stdio).
mcp = ["rscode/mcp", "dep:tokio"]
## Build OpenSSL from source and link it statically (used for release binaries), instead of linking the system's.
vendored-openssl = ["cargo/vendored-openssl"]

# `cargo binstall cargo-rscode` downloads the archives the `release` workflow attaches to `cargo-rscode-v*` releases
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-v{ version }-{ target }.tar.gz"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/{ name }-v{ version }/{ name }-v{ version }-{ target }.zip"
pkg-fmt = "zip"
