[package]
name = "cargo-rscode"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

description = "Cargo subcommand (and MCP server) for viewing, searching, and editing Rust source files by item path"
categories = ["development-tools", "development-tools::cargo-plugins", "command-line-utilities"]
keywords = ["cargo", "refactoring", "mcp", "rustfmt"]

[dependencies]
anyhow.workspace = true
cargo.workspace = true
clap.workspace = true
clap_complete.workspace = true
rscode = { workspace = true, features = ["cargo", "clap"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true }

[features]
default = ["mcp"]
## `cargo rscode mcp`: serve rscode's operations over the Model Context Protocol (stdio).
mcp = ["rscode/mcp", "dep:tokio"]
