[package]
name = "rscode_fmt"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

description = "Formatting of Rust source files and individual items via rustfmt or prettyplease"
categories = ["development-tools"]
keywords = ["rust", "format", "rustfmt", "prettyplease"]

[dependencies]
clap = { workspace = true, optional = true }
prettyplease.workspace = true
proc-macro2.workspace = true
quote.workspace = true
rscode_sort.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
syn.workspace = true
thiserror.workspace = true

[features]
default = []

## Implements `clap::ValueEnum` for the public option enums.
clap = ["dep:clap", "rscode_sort/clap"]
