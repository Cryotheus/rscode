# Builds `cargo-rscode` for every target `cargo binstall` can install it on, and attaches the archives to a GitHub
# release. Push a tag `cargo-rscode-v<version>` (matching the `version` cargo-rscode inherits from `[workspace.package]`
# in Cargo.toml) to release.
#
# A run builds with the workflow of the tagged commit, so running it again cannot pick up a fix. Run this workflow by
# hand instead (Actions, release, Run workflow) with the tag: it builds the tag with the workflow of the branch it runs
# on, and its archives replace those of the release.
#
# The archive names and layout must match `[package.metadata.binstall]` in crates/cargo-rscode/Cargo.toml.

name: release

on:
  push:
    tags: ["cargo-rscode-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to build, `cargo-rscode-v<version>`"
        required: true

# runs for one tag upload the same archives, so they take turns
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

env:
  # the tag pushed, or the one given to a run by hand
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  # the nightly rscode is developed with; bump deliberately. Not named `TOOLCHAIN`: Windows does not tell environment
  # variables apart by case, which hides the `toolchain` variable of dtolnay/rust-toolchain from its own scripts
  RUST_TOOLCHAIN: nightly-2026-09-28
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_STRIP: symbols

jobs:
  release:
    name: create the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # cargo-rscode inherits its version from the workspace, so ask cargo rather than reading its manifest
      - name: check that the tag matches the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "cargo-rscode") | .version')

          if [ "${RELEASE_TAG}" != "cargo-rscode-v${version}" ]; then
            echo "::error::tag ${RELEASE_TAG} does not match cargo-rscode ${version}"
            exit 1
          fi

      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${RELEASE_TAG}" > /dev/null 2>&1 || gh release create "${RELEASE_TAG}" --verify-tag --title "${RELEASE_TAG}" --generate-notes

  build:
    name: build ${{ matrix.target }}
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      # OpenSSL is linked statically so the binaries do not depend on the system's (it is not used on Windows)
      - name: build
        run: cargo build --release --package cargo-rscode --features vendored-openssl --target ${{ matrix.target }}

      - name: package
        id: package
        shell: bash
        run: |
          name="cargo-rscode-${RELEASE_TAG#cargo-rscode-}-${{ matrix.target }}"
          mkdir "${name}"
          cp README.md LICENSE-APACHE LICENSE-MIT "${name}/"

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/cargo-rscode.exe" "${name}/"
            7z a "${name}.zip" "${name}"
            echo "archive=${name}.zip" >> "${GITHUB_OUTPUT}"
          else
            cp "target/${{ matrix.target }}/release/cargo-rscode" "${name}/"
            tar -czf "${name}.tar.gz" "${name}"
            echo "archive=${name}.tar.gz" >> "${GITHUB_OUTPUT}"
          fi

      - name: upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${RELEASE_TAG}" "${{ steps.package.outputs.archive }}" --clobber
