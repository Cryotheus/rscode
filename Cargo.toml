[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/cargo-rscode"]

[workspace.package]
authors = ["Cryotheum"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.104"
futures = "0.3.34"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smol_str = { version = "0.3.6", features = ["borsh", "serde"] }
syn = { version = "3.0.6", features = ["full"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "full"] }

# matching dependencies to the manifest of `cargo`
cargo = "0.99.0"
clap = "4.6.0"
clap_complete = { version = "4.6.0", features = ["unstable-dynamic"] }
